<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agent Connect thumbnail</title>
    <style>
      @font-face {
        font-family: "Figtree Variable";
        font-style: normal;
        font-weight: 300 900;
        src: url("../node_modules/@fontsource-variable/figtree/files/figtree-latin-wght-normal.woff2")
          format("woff2-variations");
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        place-items: center;
        width: 1200px;
        height: 800px;
        margin: 0;
        overflow: hidden;
        color: #111820;
        background:
          radial-gradient(circle at 88% 10%, #e8e7ff 0, transparent 34%),
          radial-gradient(circle at 10% 92%, #dff3ef 0, transparent 34%),
          #f7f8fa;
        font-family: "Figtree Variable", ui-sans-serif, system-ui, sans-serif;
      }

      main {
        display: flex;
        align-items: center;
        width: 1080px;
        height: 680px;
        padding: 84px;
        border: 1px solid #d8dee5;
        border-radius: 28px;
        background: rgb(255 255 255 / 90%);
        box-shadow: 0 30px 80px rgb(30 42 54 / 10%);
      }

      h1 {
        max-width: 900px;
        margin: 0;
        font-size: 112px;
        font-weight: 780;
        line-height: 0.97;
        letter-spacing: -0.055em;
      }

      h1 span {
        display: block;
        color: #08796e;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Agent Connect: <span>Bring Your Own Agent</span></h1>
    </main>
  </body>
</html>
