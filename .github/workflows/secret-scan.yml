name: Secret scan

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the triggering revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: List fetched branches and tags
        run: git for-each-ref --format='%(refname)' refs/remotes/origin refs/tags

      - name: Install pinned Gitleaks
        run: ./scripts/install-gitleaks.sh

      - name: Scan all fetched refs and the triggering revision
        run: ./scripts/scan-secrets.sh history
