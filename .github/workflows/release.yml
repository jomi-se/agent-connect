name: Release

# Every push to main publishes whichever package versions are not on npm yet.
# Main only receives commits that passed the required PR checks, so this
# workflow builds and publishes without repeating that verification.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: Find unpublished versions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.plan.outputs.version }}
      sdk_version: ${{ steps.plan.outputs.sdk_version }}
      gateway: ${{ steps.plan.outputs.gateway }}
      sdk: ${{ steps.plan.outputs.sdk }}
      image_registry: ${{ steps.plan.outputs.image_registry }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.15.0
          package-manager-cache: false
      - name: Compare package versions with npm
        id: plan
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          version=$(node -p 'require("./packages/gateway-npm/package.json").version')
          sdk_version=$(node -p 'require("./packages/web-sdk/package.json").version')
          unpublished() { [[ "$(npm view "$1@$2" version 2>/dev/null)" != "$2" ]]; }
          gateway=false sdk=false
          if unpublished @open-agent-connect/gateway "$version"; then gateway=true; fi
          if unpublished @open-agent-connect/web "$sdk_version"; then sdk=true; fi
          echo "gateway $version unpublished: $gateway; SDK $sdk_version unpublished: $sdk"
          {
            echo "version=$version"
            echo "sdk_version=$sdk_version"
            echo "gateway=$gateway"
            echo "sdk=$sdk"
            echo "image_registry=ghcr.io/${OWNER,,}/agent-connect-session"
          } >> "$GITHUB_OUTPUT"

  sdk:
    name: Publish the web SDK
    if: needs.plan.outputs.sdk == 'true'
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.15.0
          cache: npm
      - run: npm install --global npm@11.19.1
      - run: npm ci
      - name: Pack the SDK
        run: npm pack --workspace @open-agent-connect/web --pack-destination "$RUNNER_TEMP"
      - name: Smoke-test and publish the exact tarball
        env:
          VERSION: ${{ needs.plan.outputs.sdk_version }}
        run: |
          tarball="$RUNNER_TEMP/open-agent-connect-web-$VERSION.tgz"
          node scripts/smoke-web-sdk-package.mjs "$tarball"
          npm publish "$tarball" --access public --tag latest --provenance

  image:
    name: Publish the multiarch session image
    if: needs.plan.outputs.gateway == 'true'
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      ref: ${{ steps.reference.outputs.ref }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.15.0
          package-manager-cache: false
      - run: ./scripts/install-build-tools.sh
      - run: ./deploy/gateway/session/build-local.sh --runners-only
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Authenticate GHCR with the ephemeral job token
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the image
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/gateway/session/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ needs.plan.outputs.image_registry }}:${{ needs.plan.outputs.version }}
          provenance: true
      - name: Record the immutable image digest
        id: reference
        env:
          REGISTRY: ${{ needs.plan.outputs.image_registry }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          printf 'ref=%s@%s\n' "$REGISTRY" "$DIGEST" >> "$GITHUB_OUTPUT"

  native:
    name: Native gateway (${{ matrix.target }})
    needs: [plan, image]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      AGENT_CONNECT_SESSION_IMAGE: ${{ needs.image.outputs.ref }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.15.0
      - run: ./scripts/install-build-tools.sh
      - name: Require a digest-pinned image for every binary
        run: '[[ "$AGENT_CONNECT_SESSION_IMAGE" =~ ^ghcr\.io/[^@]+@sha256:[a-f0-9]{64}$ ]]'
      - name: Build target archives and checksums with cargo-dist
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: dist build --artifacts local --target "$TARGET" --tag "v$VERSION" --no-local-paths
      - name: Record image and version from the exact native archive executables
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: node scripts/release-info.mjs record --target "$TARGET" --version "$VERSION" --image "$AGENT_CONNECT_SESSION_IMAGE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-${{ matrix.target }}
          path: |
            target/distrib/*.tar.xz
            target/distrib/*.sha256
            target/distrib/*.release-info.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  package:
    name: Pack the gateway npm packages
    needs: [plan, image, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      AGENT_CONNECT_SESSION_IMAGE: ${{ needs.image.outputs.ref }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.15.0
          cache: npm
      - run: npm install --global npm@11.19.1
      - run: npm ci
      - run: node scripts/release.mjs check
      - run: ./scripts/install-build-tools.sh
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: native-*
          path: target/distrib
          merge-multiple: true
      - name: Generate the global shell installer without rebuilding binaries
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: dist build --artifacts global --tag "v$VERSION" --no-local-paths
      - name: Pack the launcher, platform packages and release metadata
        run: |
          mkdir -p dist/release
          cp target/distrib/*.sha256 dist/release/
          node scripts/release.mjs pack --image "$AGENT_CONNECT_SESSION_IMAGE" --artifacts target/distrib --directory dist/release
      - name: Preview npm publication
        run: node scripts/release.mjs publish-dry-run --directory dist/release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ needs.plan.outputs.version }}
          path: dist/release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    name: Publish the gateway packages with OIDC
    needs: [plan, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.15.0
          package-manager-cache: false
      - run: npm install --global npm@11.19.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-${{ needs.plan.outputs.version }}
          path: dist/release
      - name: Publish platform packages, then the launcher
        env:
          AGENT_CONNECT_PUBLISH_APPROVED: ${{ needs.plan.outputs.version }}
        run: node scripts/release.mjs publish --directory dist/release
