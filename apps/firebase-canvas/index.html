        <section
          id="how"
          class="desktop-explanation"
          aria-labelledby="how-title"
        >
          <div class="explanation-copy">
            <h2 id="how-title">Two pieces, two owners.</h2>
            <p>
              App developers integrate the SDK. Agent owners run the gateway
              inside their own boundary.
            </p>
          </div>
          <div class="responsibility-list persona-list">
            <article>
              <span class="persona-label">For app developers</span>
              <h3>Agent Connect SDK</h3>
              <p>
                Define scoped, app-native actions in the browser. The public API
                does not depend on Codex, OmniGENT, or another harness.
              </p>
              <strong>Tools execute in the app.</strong>
            </article>
            <article>
              <span class="persona-label">For agent owners</span>
              <h3>Agent Connect Gateway</h3>
              <p>
                Run it beside Codex or another coding agent on a laptop, VM, or
                isolated runner. It owns identity, consent, grants, and provider
                adapters.
              </p>
              <strong>The agent stays user-owned.</strong>
            </article>
          </div>
          <div class="security-note">
            <strong>Consent is not a trust guarantee.</strong>
            <span
              >The connector shows the exact app origin and requested tools so
              the user can decide—and revoke access later.</span
            >
          </div>
        </section>

        <section id="code" class="desktop-code" aria-labelledby="code-title">
          <div class="code-intro">
            <h2 id="code-title">The browser side</h2>
            <p>Ordinary functions become request-scoped tools.</p>
          </div>
          <article class="code-example">
            <div class="code-heading">
              <span>app.ts</span>
              <button
                class="copy-button"
                type="button"
                data-copy-target="sdk-snippet"
              >
                Copy
              </button>
            </div>
            <pre
              id="sdk-snippet"
            ><code data-language="typescript">const moveTasks = defineTool({
  name: "move_project_tasks",
  inputSchema: moveTasksSchema,
  execute: ({ moves }) =&gt; {
    board.moveAll(moves)
  }
})

const connection = await connectAgent({
  baseUrl: runtimeCard.endpoint,
  tools: [createTasks, updateTasks, moveTasks],
  accessToken
})

for await (const event of connection.session.streamTask(prompt)) {
  render(event)
}</code></pre>
          </article>
        </section>
