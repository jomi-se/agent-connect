[package]
name = "agent-connect-gateway"
version = "0.0.7"
edition = "2024"
publish = false
license = "MIT"
repository = "https://github.com/jomi-se/agent-connect"
description = "Consent-enforcing ACP gateway for user-owned agents"

[dependencies]
agent-client-protocol = { version = "=5.5.1", features = ["unstable_mcp_over_acp"] }
agent-client-protocol-conductor = "=5.5.1"
anyhow = "1"
rpassword = "7"
inquire = { version = "0.9", default-features = false, features = ["crossterm", "fuzzy"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
# ring and bundled roots for reqwest: no C crypto in the static builds, no host CA store.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-root-certs = "1"
argon2 = "0.6"
base64 = "0.23"
qrcodegen = "1.8"
hmac = "0.13"
rand = "0.10"
sha1 = "0.11"
sha2 = "0.11"
url = "2"
serde_urlencoded = "0.7"
axum = { version = "0.8", features = ["ws"] }
futures = "0.3"
clap = { version = "4", features = ["derive", "env"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
# axum's version, so its WebSocket errors downcast to tungstenite::Error.
tungstenite = "=0.29.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
webauthn-rs = "=0.6.2"

libc = "0.2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
webauthn-authenticator-rs = { version = "=0.6.2", features = ["softpasskey"] }

[package.metadata.dist]
dist = true
