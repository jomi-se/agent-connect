[package]
name = "agent-connect-gateway"
version = "0.1.0-alpha.1"
edition = "2024"
publish = false
license = "MIT"
repository = "https://github.com/jomi-se/agent-connect"
description = "Consent-enforcing ACP gateway for user-owned agents"

[dependencies]
agent-client-protocol = { version = "=2.2.0", features = ["unstable_mcp_over_acp"] }
agent-client-protocol-conductor = "=2.2.0"
agent-client-protocol-polyfill = "=2.2.0"
agent-client-protocol-rmcp = { version = "=3.1.1", features = ["unstable_mcp_over_acp"] }
anyhow = "1"
rpassword = "7"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
argon2 = "0.5"
base64 = "0.22"
hmac = "0.12"
rand = "0.8"
sha1 = "0.10"
sha2 = "0.10"
url = "2"
serde_urlencoded = "0.7"
axum = { version = "0.8", features = ["ws"] }
futures = "0.3"
clap = { version = "4", features = ["derive", "env"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tungstenite = "=0.29.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

libc = "0.2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[package.metadata.dist]
dist = true
