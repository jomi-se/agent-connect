[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.33.0"
# Whether to consider the binaries in a package for distribution (defaults true)
dist = true
# CI backends to support
ci = []
# Metadata for archive/installer URLs only; no release workflow is enabled.
hosting = ["github"]
# The installers to generate for each app
installers = ["shell", "npm"]
# A namespace to use when publishing this package to the npm registry
npm-scope = "@open-agent-connect"
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-musl", "x86_64-unknown-linux-musl"]
# Skip checking whether the specified configuration files are up to date
allow-dirty = ["ci"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false

[dist.binaries]
aarch64-apple-darwin = ["agent-connect-gateway"]
x86_64-unknown-linux-musl = ["agent-connect-gateway"]
aarch64-unknown-linux-musl = ["agent-connect-gateway"]
