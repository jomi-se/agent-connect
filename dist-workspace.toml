[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.33.0"
rust-toolchain-version = "1.98.1"
# Whether to consider the binaries in a package for distribution (defaults true)
dist = true
# CI backends to support
ci = []
# The hand-authored workflow is manual and enforces the owner-pushed tag boundary.
hosting = ["github"]
# The installers to generate for each app
installers = ["shell"]
# scripts/acp-release.mjs owns npm launcher/platform/SDK packaging.
checksum = "sha256"
unix-archive = ".tar.xz"
source-tarball = false
create-release = false
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-musl", "x86_64-unknown-linux-musl"]
# Skip checking whether the specified configuration files are up to date
allow-dirty = ["ci"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false

[dist.github-custom-runners]
aarch64-apple-darwin = "macos-14"
x86_64-unknown-linux-musl = "ubuntu-24.04"
aarch64-unknown-linux-musl = "ubuntu-24.04-arm"
global = "ubuntu-24.04"

[dist.binaries]
aarch64-apple-darwin = ["agent-connect-gateway"]
x86_64-unknown-linux-musl = ["agent-connect-gateway"]
aarch64-unknown-linux-musl = ["agent-connect-gateway"]
